# Git hooks, run by Lefthook (https://lefthook.dev). Install Lefthook, then
# run `lefthook install` once in the repository.

pre-commit:
  commands:
    # Only the lines being committed: much of the code predates
    # .clang-format, and reformatting whole files would bury real changes.
    format:
      glob: "*.{cpp,h}"
      run: git clang-format --staged --diff --quiet {staged_files}

pre-push:
  commands:
    # Builds and runs the unit tests and car checks; the scenario tests take
    # minutes and run with scripts/run-tests.sh, the perf test's timings
    # depend on the machine (scripts/run-tests.sh build -L perf), and the
    # slow tests sweep every file of a kind on the disc
    # (scripts/run-tests.sh build -L slow).
    tests:
      run: scripts/run-tests.sh build -E tst_scenarios -LE 'perf|slow'
