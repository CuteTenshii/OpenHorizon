name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and tests
    # SDL3 is packaged from Ubuntu 25.04 on; ubuntu-latest is still 24.04.
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config \
            libsdl3-dev libgl-dev libegl-dev libglm-dev libpugixml-dev libsqlite3-dev \
            libfreetype-dev libfontconfig-dev libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev zlib1g-dev libshaderc-dev libcatch2-dev

      - uses: actions/checkout@v7

      # A full build takes about six minutes; with the compiler cache a push
      # that touches a few files recompiles only those.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 1G

      # There is no game data here: every test that needs the disc skips itself
      # without FH1_GAME_DIR, and the GL cases skip when no context can be made.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIO_DRIVER: dummy
        run: ctest --test-dir build --output-on-failure --parallel 4 -LE 'perf|slow'

  windows:
    name: Windows build and tests (MSVC)
    # Windows Server 2025 with Visual Studio and vcpkg (C:\vcpkg) installed.
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v7

      # FFmpeg and shaderc take most of an hour to build from source; the
      # built packages are reused until vcpkg.json changes.
      - uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}

      # vcpkg.json pins a builtin-baseline, which vcpkg looks up in its own
      # git history; the image's clone may be shallow.
      - name: Prepare vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          if ((git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse --is-shallow-repository) -eq "true") {
            git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --unshallow
          } else {
            git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin
          }

      # The preset builds with Ninja and cl, which need the Visual Studio
      # developer environment.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows
          max-size: 1G

      # ccache can only cache cl's output when the debug information is
      # embedded in each object (/Z7) rather than shared in one .pdb (/Zi);
      # CMake honours the setting only under policy CMP0141.
      - name: Configure
        run: >
          cmake --preset windows-release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIO_DRIVER: dummy
        run: ctest --preset windows-release --parallel 4 -LE "perf|slow"

  format:
    name: Formatting of changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Much of the code predates .clang-format, so only the lines a pull
      # request changes are checked, as the pre-commit hook does.
      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git clang-format --diff --quiet "$BASE_SHA"
